<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Will you go out with me?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffe6ee;
    --bg2: #ffd0df;
    --ink: #3a1230;
    --muted: #7a5a73;
    --yes: #e0245e;
    --yes-ink: #ffffff;
    --no-bg: #f6dbe5;
    --no-ink: #5a3a52;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #26101f;
      --bg2: #3a1630;
      --ink: #ffe9f0;
      --muted: #d6aec6;
      --yes: #ff5c8a;
      --yes-ink: #2a0b1a;
      --no-bg: #4a2540;
      --no-ink: #f3d3e4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #26101f;
    --bg2: #3a1630;
    --ink: #ffe9f0;
    --muted: #d6aec6;
    --yes: #ff5c8a;
    --yes-ink: #2a0b1a;
    --no-bg: #4a2540;
    --no-ink: #f3d3e4;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    background-image: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 24px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .face {
    font-size: clamp(5rem, 24vw, 8rem);
    line-height: 1;
    display: inline-block;
    user-select: none;
  }
  .face.pop { animation: pop 0.35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop {
    0% { transform: scale(.6) rotate(-8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.02em;
    text-wrap: balance;
    min-height: 2.3em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sub { margin: 0; color: var(--muted); font-size: 1.05rem; text-wrap: balance; }
  .buttons {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 6px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 999px;
    transition: transform .15s ease, font-size .25s ease, padding .25s ease, opacity .25s ease;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #yes {
    background: var(--yes);
    color: var(--yes-ink);
    font-weight: 800;
    font-size: 1.25rem;
    padding: 0.7em 1.6em;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
  }
  #yes:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  #yes.fill { width: 100%; }
  #no {
    background: var(--no-bg);
    color: var(--no-ink);
    font-weight: 600;
    font-size: 1rem;
    padding: 0.7em 1.3em;
  }
  #no[hidden] { display: none; }
  #ask { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
  #celebrate { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #celebrate[hidden], #ask[hidden] { display: none !important; }
  .again {
    background: transparent;
    color: var(--muted);
    font-size: .95rem;
    padding: .5em 1em;
    text-decoration: underline;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  @media (prefers-reduced-motion: reduce) {
    .face.pop { animation: none; }
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section id="ask" aria-live="polite">
    <div class="face" id="face">🥺</div>
    <h1 id="question">Will you go out with me?</h1>
    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </section>

  <section id="celebrate" hidden aria-live="polite">
    <div class="face pop">🥰</div>
    <h1 id="winTitle">Yay!</h1>
    <p class="sub" id="winSub"></p>
    <button class="again" id="again">Play again</button>
  </section>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
  // Personalise by editing these, or add ?to=Her&from=Me to the link.
  var params = new URLSearchParams(location.search);
  var TO = (params.get("to") || "").trim();
  var FROM = (params.get("from") || "").trim();

  var steps = [
    { face: "🥺", q: TO ? "Will you go out with me, " + TO + "?" : "Will you go out with me?", no: "No" },
    { face: "🤨", q: "Are you sure?", no: "Yes, I'm sure" },
    { face: "🥹", q: "Really sure? Like, really really?", no: "Really sure" },
    { face: "😢", q: "Take a second and think about it.", no: "I thought about it" },
    { face: "😭", q: "This is getting sad for me.", no: "Still no" },
    { face: "🍫", q: "What if I bring snacks?", no: "Not even snacks" },
    { face: "🎬", q: "You can pick the movie.", no: "Nope" },
    { face: "🎶", q: "And you control the music the whole time.", no: "Nope" },
    { face: "🍕", q: "I'll plan the whole date. You just show up.", no: "Still no" },
    { face: "🙏", q: "Okay, last chance to change your mind.", no: "Please stop" },
    { face: "😮‍💨", q: "The No button is getting tired.", no: "..." },
    { face: "😌", q: "Fine, I removed it. Only one option left.", no: null }
  ];

  // Get a phone notification when she answers.
  // 1) Install the free "ntfy" app and subscribe to a topic name only you know.
  // 2) Put that same topic name between the quotes below.
  var NTFY_TOPIC = "";

  function notify(message) {
    if (!NTFY_TOPIC) return;
    try {
      fetch("https://ntfy.sh/" + encodeURIComponent(NTFY_TOPIC), {
        method: "POST",
        body: message,
        mode: "no-cors"
      }).catch(function () {});
    } catch (e) {}
  }

  var i = 0;
  var face = document.getElementById("face");
  var question = document.getElementById("question");
  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var ask = document.getElementById("ask");
  var celebrate = document.getElementById("celebrate");

  function render() {
    var s = steps[i];
    face.textContent = s.face;
    face.classList.remove("pop");
    void face.offsetWidth;
    face.classList.add("pop");
    question.textContent = s.q;

    // Yes keeps growing, No keeps shrinking.
    yes.style.fontSize = (1.25 + i * 0.32) + "rem";
    yes.style.padding = (0.7 + i * 0.05) + "em " + (1.6 + i * 0.2) + "em";
    yes.classList.toggle("fill", i >= 9);
    var scale = Math.max(0.55, 1 - i * 0.05);
    no.style.fontSize = (1 * scale) + "rem";
    no.style.padding = (0.7 * scale) + "em " + (1.3 * scale) + "em";

    if (s.no === null) {
      no.hidden = true;
    } else {
      no.hidden = false;
      no.textContent = s.no;
    }
  }

  no.addEventListener("click", function () {
    if (i < steps.length - 1) { i++; render(); }
  });

  yes.addEventListener("click", function () {
    ask.hidden = true;
    celebrate.hidden = false;
    document.getElementById("winTitle").textContent = TO ? "Yay, " + TO + "!" : "Yay!";
    document.getElementById("winSub").textContent =
      "It's a date. Screenshot this and send it to " + (FROM || "me") + " so it's official.";
    launchConfetti();
    notify(i === 0
      ? "She said YES right away!"
      : "She said YES after clicking No " + i + (i === 1 ? " time!" : " times!"));
  });

  document.getElementById("again").addEventListener("click", function () {
    i = 0;
    celebrate.hidden = true;
    ask.hidden = false;
    render();
  });

  // Confetti
  var canvas = document.getElementById("confetti");
  var ctx = canvas.getContext("2d");
  var pieces = [];
  var raf = null;

  function size() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
  }
  window.addEventListener("resize", size);
  size();

  function launchConfetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#e0245e", "#ff8fb1", "#ffd166", "#7bdff2", "#b794f4", "#ffffff"];
    pieces = [];
    for (var n = 0; n < 160; n++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: -Math.random() * canvas.height * 0.6,
        w: (6 + Math.random() * 8) * devicePixelRatio,
        h: (10 + Math.random() * 10) * devicePixelRatio,
        vy: (2 + Math.random() * 4) * devicePixelRatio,
        vx: (Math.random() - 0.5) * 3 * devicePixelRatio,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    if (raf) cancelAnimationFrame(raf);
    (function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = 0;
      pieces.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y < canvas.height + 40) alive++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive > 0) raf = requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    })();
  }

  render();
</script>
</body>
</html>
